name = "cf-workbuddy"
main = "src/worker.js"
compatibility_date = "2026-09-20"

# Keep variables and secrets that exist on Cloudflare but are absent from this
# file, so a deploy never silently wipes them. Learned from edgetunnel, which
# uses the same flag for the same reason.
keep_vars = true

# KV holds API keys and the model cache. Create it once with:
#   npx wrangler kv namespace create KEYS
# then paste the returned id below.
[[kv_namespaces]]
binding = "KEYS"
id = "890e940c077d49be8d30aa4defc393be"

# Serve on the custom domain. A Worker Custom Domain is the cleaner option
# than a route: Cloudflare issues and renews the certificate automatically and
# the hostname cannot be claimed by another Worker by accident.
[[routes]]
pattern = "kz007.ccwu.cc"
custom_domain = true

# Keep one isolate warm. An idle Worker is evicted, and the first request
# after that pays to load and parse the script again — measured at ~2.5s cold
# versus ~0.3-0.8s warm. Five minutes is the shortest cron interval.
[triggers]
crons = ["*/5 * * * *"]

# Run the Worker close to the upstream backend (Singapore) instead of wherever
# the client happens to land. The client → Cloudflare edge hop is unchanged;
# this shortens the bigger leg: edge → upstream. On the free plan this key
# may be ignored; the deploy output will tell us.
[placement]
mode = "smart"

[vars]
WORKER_HOST = "kz007.ccwu.cc"
ENDPOINT = "https://www.workbuddy.ai"
CLIENT_VERSION = "5.5.2"

# Expose only the models that are currently free.
FREE_ONLY = "true"

# Require a generated API key on /v1/chat/completions and /v1/models.
REQUIRE_KEY = "true"

# Record per-key usage. Off by default: the free KV tier allows 1,000 writes
# per day, so counting every request would exhaust the quota and then fail.
COUNT_USAGE = "false"

# Secrets are set separately, never committed:
#   npx wrangler secret put UPSTREAM_TOKEN
#   npx wrangler secret put ADMIN_PASSWORD
